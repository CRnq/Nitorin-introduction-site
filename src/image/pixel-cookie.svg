<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="256" height="256" shape-rendering="crispEdges" role="img" aria-label="Pixel art chocolate chip cookie">
  <rect width="16" height="16" fill="none"/>

  <!-- Cookie shadow -->
  <rect x="4" y="14" width="8" height="1" fill="#9b5f2c" opacity="0.35"/>

  <!-- Cookie outline -->
  <rect x="5" y="1" width="6" height="1" fill="#8b4a22"/>
  <rect x="3" y="2" width="2" height="1" fill="#8b4a22"/>
  <rect x="11" y="2" width="2" height="1" fill="#8b4a22"/>
  <rect x="2" y="3" width="1" height="2" fill="#8b4a22"/>
  <rect x="13" y="3" width="1" height="2" fill="#8b4a22"/>
  <rect x="1" y="5" width="1" height="6" fill="#8b4a22"/>
  <rect x="14" y="5" width="1" height="6" fill="#8b4a22"/>
  <rect x="2" y="11" width="1" height="2" fill="#8b4a22"/>
  <rect x="13" y="11" width="1" height="2" fill="#8b4a22"/>
  <rect x="3" y="13" width="2" height="1" fill="#8b4a22"/>
  <rect x="11" y="13" width="2" height="1" fill="#8b4a22"/>
  <rect x="5" y="14" width="6" height="1" fill="#8b4a22"/>

  <!-- Cookie base -->
  <rect x="5" y="2" width="6" height="1" fill="#d99745"/>
  <rect x="3" y="3" width="10" height="2" fill="#d99745"/>
  <rect x="2" y="5" width="12" height="6" fill="#d99745"/>
  <rect x="3" y="11" width="10" height="2" fill="#d99745"/>
  <rect x="5" y="13" width="6" height="1" fill="#d99745"/>

  <!-- Warm highlights -->
  <rect x="5" y="3" width="3" height="1" fill="#f1bb65"/>
  <rect x="3" y="5" width="2" height="1" fill="#f1bb65"/>
  <rect x="6" y="6" width="3" height="1" fill="#e8ad58"/>
  <rect x="4" y="9" width="2" height="1" fill="#e8ad58"/>
  <rect x="8" y="11" width="3" height="1" fill="#e8ad58"/>

  <!-- Baked darker edge pixels -->
  <rect x="3" y="4" width="1" height="1" fill="#b96f30"/>
  <rect x="12" y="4" width="1" height="1" fill="#b96f30"/>
  <rect x="2" y="8" width="1" height="2" fill="#b96f30"/>
  <rect x="13" y="8" width="1" height="2" fill="#b96f30"/>
  <rect x="4" y="12" width="1" height="1" fill="#b96f30"/>
  <rect x="11" y="12" width="1" height="1" fill="#b96f30"/>

  <!-- Chocolate chips -->
  <rect x="7" y="4" width="2" height="2" fill="#4a2617"/>
  <rect x="11" y="6" width="2" height="2" fill="#4a2617"/>
  <rect x="4" y="7" width="2" height="2" fill="#4a2617"/>
  <rect x="8" y="9" width="2" height="2" fill="#4a2617"/>
  <rect x="5" y="11" width="1" height="1" fill="#4a2617"/>
  <rect x="11" y="10" width="1" height="1" fill="#4a2617"/>

  <!-- Chip highlights -->
  <rect x="7" y="4" width="1" height="1" fill="#6b3b24"/>
  <rect x="11" y="6" width="1" height="1" fill="#6b3b24"/>
  <rect x="4" y="7" width="1" height="1" fill="#6b3b24"/>
  <rect x="8" y="9" width="1" height="1" fill="#6b3b24"/>
</svg>
